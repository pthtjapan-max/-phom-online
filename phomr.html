<style>

#root{position:fixed;inset:0}

.felt{position:absolute;left:1.5%;right:1.5%;top:calc(env(safe-area-inset-top,0px) + 40px);bottom:calc(var(--cwb)*1.4 + env(safe-area-inset-bottom,0px) + 12px);border-radius:min(16vw,110px);border:clamp(4px,1.2vw,9px) solid #e6b422;background:radial-gradient(ellipse at center,#d02a22,#7a0c0c);box-shadow:inset 0 0 30px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.5)}

.zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:2;--cw:calc(var(--cwb)*.62)}
.z-t{grid-area:t;flex-direction:row;flex-wrap:wrap}.z-l{grid-area:l}.z-r{grid-area:r}.z-b{grid-area:b;flex-direction:row;flex-wrap:wrap;gap:8px}
.who{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:20px;background:rgba(70,4,4,.75);border:1px solid #e6b422;font-size:11px}

.nm{display:flex;flex-direction:column;line-height:1.15;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mid{grid-area:c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;z-index:2;--cw:calc(var(--cwb)*.8)}
.hint{color:#fff3c4;font-size:11px;max-width:90%;text-shadow:0 1px 2px #000;min-height:2.6em}

.hc{cursor:pointer;transition:transform .15s}

.hc.sel::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:calc(var(--cw)*.07);background:conic-gradient(from var(--ang),#ff1f1f,#ffd54a,#ff1f1f,#ffd54a,#ff1f1f);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 1.1s linear infinite;pointer-events:none}
.card{--cf:#fff;position:relative;flex:none;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);box-shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.12);user-select:none;overflow:hidden}

.bn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:calc(var(--cw)*.55);padding:calc(var(--cw)*.04) calc(var(--cw)*.08);border-radius:999px;background:#fff;color:#7a0c0c;font-weight:800;font-size:calc(var(--cw)*.34);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.btn{font:inherit;font-weight:700;color:#fff3c4;background:linear-gradient(#e8402f,#a31212);border:2px solid #ffd54a;border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer}

.hbtns{display:flex;gap:6px}
.ib{font:inherit;display:inline-flex;align-items:center;justify-content:center;width:42px;height:38px;padding:0;border-radius:12px;background:linear-gradient(#f2503c,#a31212);border:2px solid #ffd54a;color:#ffd54a;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.45);transition:transform .1s,filter .15s}
.ib:hover{filter:brightness(1.12)}.ib:active{transform:translateY(1px) scale(.96)}
.ib svg{width:28px;height:22px;display:block;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.ca,.cb{transform:translate(var(--t),0)}
.ca{--t:0px;--f:17px;--h:-7px}.cb{--t:0px;--f:-17px;--h:7px}
.sw .ca{--t:17px;--f:0px}.sw .cb{--t:-17px;--f:0px}
.go .ca,.go .cb{animation:sw .55s ease-in-out}
@keyframes sw{0%{transform:translate(var(--f),0)}50%{transform:translate(calc((var(--f) + var(--t))/2),var(--h))}100%{transform:translate(var(--t),0)}}

.ib:hover .arr,.ib.open .arr{opacity:1}
.coin{display:inline-flex;align-items:center;gap:3px;color:var(--ct);font-weight:700}

.rb{--cw:clamp(16px,min(4.6vw,7.5vh),36px);background:#3a0707;border:2px solid #e6b422;border-radius:14px;padding:12px;width:min(780px,100%);margin:auto}

.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{min-width:0;background:rgba(0,0,0,.28);border:1px solid rgba(230,180,34,.45);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:4px}

.rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.rs{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:11px}

.rr{margin:10px 0}.rows{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.grp{display:flex;gap:2px}
.up{color:#ffe27a}.dn{color:#ffb3a8}
.panel{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}
.pb{background:rgba(70,6,6,.93);border:2px solid #e6b422;border-radius:16px;padding:22px;width:min(400px,100%)}

.sav{position:relative;width:clamp(50px,13vw,68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;border:2px solid #ffd54a;box-shadow:inset 0 2px 3px rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.45)}

.sn{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.sn.dim{opacity:.6}
.crown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:28px;height:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.sx{position:absolute;top:-5px;right:-5px;width:21px;height:21px;border-radius:50%;border:1.5px solid #ffd54a;background:#a31212;color:#fff3c4;font:700 14px/1 Arial,sans-serif;padding:0;cursor:pointer;display:grid;place-items:center}
.note{font-size:13px;text-align:center;min-height:1.2em}
.okc{color:#8dffb5;font-size:13px;margin-top:4px}
.muted{opacity:.8;font-size:13px;margin-bottom:4px}
.deck.dealing{filter:drop-shadow(0 0 12px #ffd54a);animation:deckPulse .7s ease-in-out infinite alternate}

#cd{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.4)}
#cd span{font-size:min(40vw,42vh,230px);line-height:1;font-weight:900;color:#ffd54a;text-shadow:0 0 28px rgba(255,90,40,.95),0 5px 0 #7a0c0c;animation:cdp .8s ease-out both}
@keyframes cdp{0%{transform:scale(2.3);opacity:0}25%{transform:scale(1);opacity:1}78%{transform:scale(1);opacity:1}100%{transform:scale(.7);opacity:0}}

.ib{position:relative}
.dot{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ffd54a;color:#7a0c0c;border:1px solid #7a0c0c;font:800 10px/15px "Times New Roman",serif;text-align:center}
.av{position:relative;overflow:hidden}
.avi{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:block}
.avi svg,.avi img{width:100%;height:100%;display:block;object-fit:cover}

.avbox{display:flex;flex-direction:column;align-items:center;margin:6px 0 10px}
.sav.pick{width:84px;margin:4px auto;background:#ffe9b0;padding:0;cursor:pointer;font:inherit}

.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;margin-top:8px}

.card.snt{--cf:#cfe8ff}

function allMelds(cards){
  const out=[],mk=idx=>({idx,mask:idx.reduce((m,i)=>m|1<<i,0),pts:idx.reduce((s,i)=>s+cards[i].r,0)});

    for(let m=1;m<1<<ix.length;m++){const sub=ix.filter((_,k)=>m>>k&1);if(sub.length>=3)out.push(mk(sub))}}
  for(let s=0;s<4;s++){const at={};cards.forEach((c,i)=>{if(c.s===s)at[c.r]=i});
    for(let a=1;a<=11;a++)for(let b=a+2;b<=13;b++){const idx=[];let ok=true;
      for(let r=a;r<=b;r++){if(at[r]===undefined){ok=false;break}idx.push(at[r])}
      if(ok)out.push(mk(idx))}}
  return out;
}
function best(cards,must=[]){

    (function dfs(i,used,ch,cov){
      if((used&need)===need&&(!top||cov>top.cov))top={cov,chosen:[...ch],used};
      for(let j=i;j<ms.length;j++)if(!(ms[j].mask&used)){ch.push(ms[j]);dfs(j+1,used|ms[j].mask,ch,cov+ms[j].pts);ch.pop()}
    })(0,0,[],0);return top};
  let top=run(mm),fail=false;if(!top){fail=true;top=run(0)}
  const total=cards.reduce((s,c)=>s+c.r,0);
  return {left:total-top.cov,fail,melds:top.chosen.map(m=>m.idx.map(i=>cards[i])),rest:cards.filter((_,i)=>!(top.used>>i&1))};
}
const canEat=(h,c,eaten=[])=>{const cs=[...h,c],k=cs.length-1;return allMelds(cs).some(m=>m.idx.includes(k))&&!best(cs,[...eaten,c.id]).fail};

function canMeld(cs){
  if(cs.length<3)return false;
  if(cs.every(c=>c.r===cs[0].r))return new Set(cs.map(c=>c.s)).size===cs.length;
  if(cs.every(c=>c.s===cs[0].s)){const r=cs.map(c=>c.r).sort((a,b)=>a-b);return r.every((x,i)=>i===0||x===r[i-1]+1)}
  return false}
function planSend(g,ids){
  const T=g.lo.slice(0,g.lp);
  for(const q of T)for(let k=0;k<g.laid[q].length;k++)if(canMeld(O([...g.laid[q][k],...ids])))return[{q,k,c:ids}];

  while(left.length&&prog){prog=false;for(const c of [...left]){let hit=false;
    for(const q of T){for(let k=0;k<cur[q].length;k++)if(canMeld(O([...cur[q][k],c]))){cur[q][k].push(c);plan.push({q,k,c:[c]});left=left.filter(x=>x!==c);prog=hit=true;break}if(hit)break}}}
  return left.length?null:plan}
function doSend(g,ids){

function layout(h,eaten){

  if(cs.length>9){let bi=-1,bs=1e9;cs.forEach((c,i)=>{if(eaten.includes(c.id))return;const r=best(cs.filter((_,j)=>j!==i),eaten),sc=(r.fail?1e3:0)+r.left;if(sc<bs){bs=sc;bi=i}});cs=cs.filter((_,j)=>j!==bi)}

}
function finish(g,u){
  const res=g.ph==='lay'?g.hands.map((h,p)=>({left:h.reduce((a,c)=>a+c%14,0),fail:!!g.lf[p],mom:!g.laid[p].length,melds:g.laid[p],rest:h})):g.hands.map((h,p)=>{const b=layout(h,g.eaten[p]);return{left:b.left,fail:b.fail,mom:!b.melds.length,melds:b.melds.map(m=>m.map(c=>c.id)),rest:b.rest.map(c=>c.id)}});

function lobbyStart(){
  const l=roomList();if(l[0]?.id!==uid)return;
  const seats=roomSeats();if(seats.length<2)return;
  startGame(seats);
}
async function leave(){
  closeChat();closeEmo();CHAT=[];unread=0;
  clearIntro();clearTimeout(turnT);turnK='';
  if(G&&!G.over){const i=seatOf();if(i>=0){const g=clone(G);g.seats[i]={...g.seats[i],bot:true,name:g.seats[i].name+' 🤖'};save(g)}}
  if(db){clearInterval(hb);resetRoomIfEmpty();await pdoc.delete().catch(()=>{})}
  me.name='';msg='';render();
}
function discard(el){
  const m=seatOf();if(sel===null||G.turn!==m||G.step!=='discard')return;
  const e=el||q1('.hc.sel');if(e)discFrom=rect(e);
  const g=clone(G),c=sel;sel=null;doDiscard(g,c);save(g);
}
const A={
  login(){login(document.getElementById('nm').value,document.getElementById('pw').value)},
  avtoggle(){keepDraft();avPick=!avPick;render()},
  avset(b){keepDraft();myAv=b.dataset.v;saveAv();render()},
  avfile(){const f=document.getElementById('avf');if(f)f.click()},
  chat(){toggleChat()},guide(){openGuide()},theme(){openTheme()},
  startroom(){lobbyStart()},bet(){const L=[100,200,500,1000];bet=L[(L.indexOf(bet)+1)%L.length];if(rdoc)rdoc.set({bots:roomBots,bet,ver:RV}).catch(()=>{});render()},offline(){const n=(document.getElementById('nm')?.value||'').trim().slice(0,14)||'Bạn';db=null;denied=false;P=[];G=null;rdoc=null;pdoc=null;roomBots=0;msg='';me.name=n;render()},addbot(){setBots(roomBots+1)},rmbot(){setBots(roomBots-1)},
  kick(b){if(confirm(('Mời '+b.dataset.n+' ra khỏi phòng?').toUpperCase()))kickPlayer(b.dataset.id)},
  again(){startGame(G.seats)},lobby(){lobbyFlag=true;render()},
  sort(){flip(()=>{sortMode=sortMode==='s'?'r':sortMode==='r'?'m':'s';try{localStorage.setItem('phom_sort',sortMode)}catch(e){}iconGo=true;render()})
  },leave,snd(){audioOn=!audioOn;try{localStorage.setItem('phom_snd',audioOn?'1':'0')}catch(e){}render()},
  draw(){eatArm=false;const g=clone(G);doDraw(g);save(g)},
  eat(){const m=seatOf(),n=G.seats.length,l=G.disc[(m+n-1)%n].at(-1);if(G.cnt[(m+n-1)%n]>=4)return;if(l!==undefined&&!canEat(O(G.hands[m]),dec(l),G.eaten[m])&&!eatArm){eatArm=true;render();return}eatArm=false;const g=clone(G);doEat(g);save(g)},
  disc(){discard()},
  send(){if(!G||G.ph!=='lay'||G.turn!==seatOf())return;const g=clone(G);if(doSend(g,selM)){selM=[];save(g)}else{msg='Không gửi được: các lá đã chọn không nối được vào phỏm nào đã hạ.';render()}},
  lay(){if(!G||G.ph!=='lay'||G.turn!==seatOf())return;const g=clone(G);selM=[];doLay(g);save(g)},
  u(){const g=clone(G);finish(g,seatOf());save(g)},
};
$r.addEventListener('click',e=>{
  if(noClick)return;
  const b=e.target.closest('[data-a]');if(b){if(intro&&b.dataset.a!=='leave'&&b.dataset.a!=='snd'&&b.dataset.a!=='chat'&&b.dataset.a!=='guide'&&b.dataset.a!=='theme')return;if(b.dataset.a==='leave'&&b.classList.contains('ib')){b.classList.add('open');setTimeout(leave,450);return}return A[b.dataset.a](b)}
  const w=e.target.closest('.who');if(w&&G&&!intro&&view()==='table'){const zi=+w.closest('.zone').dataset.seat;if(zi!==seatOf())openEmo(zi,w);return}
  if(e.target.closest('.pile .card.clk')&&G&&!intro&&!G.over&&view()==='table'&&G.turn===seatOf()&&G.step==='draw'){A.eat();return}
  const c=e.target.closest('.hc');if(!c||intro||!G||G.over||G.turn!==seatOf())return;
  const id=+c.dataset.cid;if(G.eaten[seatOf()].includes(id))return;
  if(G.ph==='lay'){msg='';selM=selM.includes(id)?selM.filter(x=>x!==id):[...selM,id];snd('pick');render();return}
  if(G.step!=='discard')return;
  sel=sel===id?null:id;snd('pick');render()
});
$r.addEventListener('pointerdown',e=>{const c=e.target.closest('.hc');if(!c||!G||G.over||intro||e.button>0)return;drag={id:+c.dataset.cid,x:e.clientX,y:e.clientY,on:false,to:null}});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.hypot(dx,dy)<10)return;drag.on=true}
  const el=q1(`.hc[data-cid="${drag.id}"]`);if(!el)return;
  el.style.transition='none';el.style.zIndex=50;el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
  const r=rect(el),cx=r.left+r.width/2;
  drag.to=[...document.querySelectorAll('.hc')].filter(x=>x!==el).filter(x=>{const q=rect(x);return q.left+q.width/2<cx}).length;
});
document.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;if(!d.on)return;
  noClick=true;setTimeout(()=>noClick=false,300);
  const ids=[...document.querySelectorAll('.hc')].map(x=>+x.dataset.cid).filter(x=>x!==d.id);
  ids.splice(d.to==null?ids.length:d.to,0,d.id);myOrd=ids;sortMode='c';snd('pick');render();
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.on)render();drag=null});
$r.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nm'||e.target.id==='pw'))login(document.getElementById('nm').value,document.getElementById('pw').value)});
$r.addEventListener('change',e=>{
  if(e.target.id!=='avf')return;const f=e.target.files[0];if(!f)return;
  keepDraft();
  toAvatar(f).then(v=>{myAv=v;saveAv();msg='';render()}).catch(()=>{msg='Không đọc được ảnh này, hãy thử ảnh JPG hoặc PNG.';render()});
});

setInterval(()=>{
  if(view()==='lobby')render();
  if(db&&PL)P.forEach(p=>{if(p.id!==uid&&Date.now()-p.at>120000&&!aliveId(p.id))db.collection('players').doc(p.id).delete().catch(()=>{})});
  if(db&&PL&&G&&!G.over&&isHost()){
    const i=G.seats.findIndex(x=>!x.bot&&x.id!==uid&&(!aliveId(x.id,50000)||!P.some(p=>p.id===x.id)));
    if(i>=0){const g=clone(G);g.seats[i]={...g.seats[i],bot:true,name:g.seats[i].name.replace(' 🤖','')+' 🤖'};save(g)}
  }
},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db&&pdoc&&me.name)pdoc.update({at:Date.now()}).catch(()=>pdoc.set({name:me.name,av:myAv||null,joined:me.joined||Date.now(),at:Date.now()}).catch(()=>{}))});
addEventListener('pagehide',e=>{if(e.persisted||!db||!pdoc||!me.name)return;clearInterval(hb);resetRoomIfEmpty();pdoc.delete().catch(()=>{})});
(async()=>{
  $r.innerHTML='<div class="panel"><div class="pb"><h1>Phỏm Online</h1><div>Đang kết nối…</div></div></div>';
  try{
    if(window.claude){db=await window.claude.use('db');const u=await window.claude.use('user');uid=u?await u.id():null}
    else if(window.firebase&&FIREBASE_CONFIG.apiKey){firebase.initializeApp(FIREBASE_CONFIG);const cr=await firebase.auth().signInAnonymously();uid=cr.user.uid;db=firebase.firestore();FB=true}
  }catch(e){db=null}
  if(!db||!uid){db=null;uid='local-'+Math.random().toString(36).slice(2,8);msg='Không kết nối được phòng chung. Chủ trang cần cấu hình Firebase (FIREBASE_CONFIG) hoặc chia sẻ qua claude.ai.'}
  else{
    pdoc=db.collection('players').doc(uid);gdoc=wrapG(db.doc('table/main'));rdoc=db.doc('room/main');
    rdoc.onSnapshot(s=>{if(!db)return;roomBots=s.exists?(s.data().bots||0):0;bet=s.exists?(s.data().bet||100):100;roomVer=s.exists?s.data().ver:null;rdocLoaded=true;checkReset();if(view()==='lobby')render()},()=>{});
    db.collection('players').onSnapshot(s=>{if(!db)return;P=s.docs.map(d=>({id:d.id,...d.data()}));noteSeen(P);social();PL=true;{const mp=P.find(p=>p.id===uid);if(mp&&mp.kk&&me.name&&mp.kk>(me.joined||0))gotKicked()}checkReset();if(view()==='lobby')render()},()=>{});
    gdoc.onSnapshot(s=>{if(!db)return;const d=s.exists?s.data():null;if(d&&d.sv===2){if(firstG&&d.over)lobbyFlag=true;firstG=false;setG(d)}else{firstG=false;G=null;softRender()}},()=>{});
  }
  render();
})();
</script></body></html>
